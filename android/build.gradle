// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // 阿里云镜像前置：国内网络直连稳定，避免 plugins.gradle.org / dl.google.com 的 TLS 握手抖动
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 21
        compileSdkVersion = 36
        targetSdkVersion = 29

        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24" // Or any version above 1.3.x
        RNNKotlinVersion = kotlinVersion

        // https://github.com/dream-horizon-org/react-native-fast-image/blob/main/docs/app-glide-module.md
        excludeAppGlideModule = true
    }
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.6.1')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

// 项目依赖仓库的阿里云镜像前置：RN 插件（DependencyUtils.configureRepositories）会为各项目
// 追加 mavenCentral/google()/jitpack，其中 androidx 只在 google 仓库发布，
// 国内直连 dl.google.com 不稳定，这里把镜像放在最前优先命中
allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
    }
}
